# The framework is the repository next door, linked rather than installed whenever its version
# satisfies the range package.json asks for: the CLI is tested against the @pinecall/agents of the
# same checkout and published depending on a version npm has.
packages:
  - "../agents"

linkWorkspacePackages: true

allowBuilds:
  esbuild: true

# Our own framework, released minutes before the CLI that needs it, and linked from its checkout in
# CI: the day's wait is for third-party packages.
minimumReleaseAgeExclude:
  - "@pinecall/agents"
